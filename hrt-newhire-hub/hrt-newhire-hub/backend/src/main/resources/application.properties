spring.application.name=newhire-compliance-hub

# In-memory H2 database - resets on every restart, fine for a demo/portfolio project
spring.datasource.url=jdbc:h2:mem:newhirehub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Toggle for the AI-assisted document validation layer.
# When false (default), a deterministic rule-based validator is used instead,
# so the project runs out of the box with no API key required.
newhire.ai-validation.enabled=false
newhire.ai-validation.api-key=${ANTHROPIC_API_KEY:}
newhire.ai-validation.model=claude-sonnet-4-6

server.port=8080
